version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # MSRV is pinned at 1.88 by rust-toolchain.toml; majors are reviewed
      # manually before adoption.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/gui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Only the GUI's own direct dependencies. Shared crypto/transport crates
    # resolve through the root workspace so versions stay aligned; bumping
    # them from here produced breaking major updates to the root manifest.
    allow:
      - dependency-name: "tauri"
      - dependency-name: "tauri-plugin-dialog"
      - dependency-name: "postgresql_embedded"
      - dependency-name: "sqlx"
      - dependency-name: "serde"
      - dependency-name: "serde_json"
      - dependency-name: "base64"
      - dependency-name: "tokio"
      - dependency-name: "prost-types"
    groups:
      gui-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The version tag pins the Rust toolchain (MSRV); bump it deliberately
      # in lockstep with rust-toolchain.toml.
      - dependency-name: "dtolnay/rust-toolchain"
