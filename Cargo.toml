[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
# Internal crates
shikra-core = { path = "crates/core" }
shikra-proto = { path = "crates/proto" }
shikra-crypto = { path = "crates/crypto" }
shikra-store = { path = "crates/store" }
shikra-transport = { path = "crates/transport" }
shikra-ai = { path = "crates/ai" }
shikra-evasion = { path = "crates/evasion" }
shikra-obf = { path = "crates/obf" }
shikra-client = { path = "crates/client" }
shikra-implant = { path = "crates/implant" }

# Async runtime
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Web / gRPC
axum = "0.8"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.3"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
hex = "0.4"
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client (beacon transport)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting"] }

# Cryptography
ed25519-dalek = { version = "2.2", default-features = false, features = [
    "rand_core",
    "zeroize",
] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom", "zeroize"] }
chacha20poly1305 = "0.10"
chacha20 = "0.9"
aes = "0.8"
ctr = "0.9"
hkdf = "0.13"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }

# CLI / logging
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# BOF/COFF loader (memory management only; COFF parsing is custom)
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_Services"] }

# WASM extensions
wasmi = { version = "2", default-features = false, features = ["std", "validate"] }
wat = "1"

# QUIC transport
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"

# Build pipeline
tempfile = "3"

# Proc macros (string obfuscation)
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro"] }

# DNS / WireGuard transports
boringtun = "0.7"
base32 = "0.5"

# Recon / MSF integration
quick-xml = "0.42"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
winreg = "0.56"

# AI / MCP
rmcp = { version = "3.5", features = ["server", "transport-io"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
